id: waf-detection

info:
  name: WAF / CDN Fingerprint (WAF / CDN Parmak İzi)
  author: ertansa
  severity: info
  description: |
    Hedefin önündeki Web Uygulama Güvenlik Duvarı (WAF) veya CDN'i, yanıt
    başlıkları, çerez adları ve sunucu imzaları üzerinden PASİF olarak tespit eder
    (Cloudflare, Akamai, Imperva/Incapsula, F5 BIG-IP, AWS WAF/ALB, Sucuri,
    Barracuda, Fortinet FortiWeb, ModSecurity, Wordfence, DDoS-Guard, StackPath,
    Fastly, Azure Front Door). Saldırı yükü göndermez; yalnızca normal bir GET
    isteğinin yanıtını inceler. Amaç yetkili taramayı hedefteki WAF'a göre
    ayarlamaktır (hız sınırı, eşzamanlılık, başlıklar). Hangi WAF'ın tespit
    edildiği çıkarıcı ile bildirilir. -dast gerektirmez.
  reference:
    - https://github.com/EnableSecurity/wafw00f
    - https://owasp.org/www-community/Web_Application_Firewall
  metadata:
    max-request: 1
  tags: waf,cdn,fingerprint,tech,recon

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: or
    matchers:
      - type: dsl
        name: cloudflare
        dsl:
          - "contains(tolower(header), 'server: cloudflare') || contains(tolower(header), 'cf-ray') || contains(tolower(header), '__cfduid') || contains(tolower(header), 'cf-cache-status') || contains(tolower(header), 'cf_clearance')"

      - type: dsl
        name: akamai
        dsl:
          - "contains(tolower(header), 'akamaighost') || contains(tolower(header), 'x-akamai') || contains(tolower(header), 'akamai-grn') || contains(tolower(header), 'x-akamai-transformed')"

      - type: dsl
        name: imperva-incapsula
        dsl:
          - "contains(tolower(header), 'x-iinfo') || contains(tolower(header), 'incap_ses') || contains(tolower(header), 'visid_incap') || contains(tolower(header), 'x-cdn: incapsula')"

      - type: dsl
        name: f5-big-ip
        dsl:
          - "contains(tolower(header), 'bigipserver') || contains(tolower(header), 'x-wa-info') || contains(tolower(header), 'ts01') || contains(tolower(header), 'server: big-ip')"

      - type: dsl
        name: aws-waf-alb
        dsl:
          - "contains(tolower(header), 'x-amzn-waf') || contains(tolower(header), 'awselb') || contains(tolower(header), 'x-amz-cf-id') || contains(tolower(header), 'x-amzn-requestid')"

      - type: dsl
        name: sucuri
        dsl:
          - "contains(tolower(header), 'x-sucuri-id') || contains(tolower(header), 'x-sucuri-cache') || contains(tolower(header), 'server: sucuri')"

      - type: dsl
        name: barracuda
        dsl:
          - "contains(tolower(header), 'barra_counter_session') || contains(tolower(header), 'barracuda')"

      - type: dsl
        name: fortinet-fortiweb
        dsl:
          - "contains(tolower(header), 'fortiwafsid') || contains(tolower(header), 'fortigate') || contains(tolower(header), 'fortiweb')"

      - type: dsl
        name: modsecurity
        dsl:
          - "contains(tolower(header), 'mod_security') || contains(tolower(header), 'modsecurity') || contains(tolower(header), 'server: naxsi')"

      - type: dsl
        name: wordfence
        dsl:
          - "contains(tolower(body), 'generated by wordfence') || contains(tolower(header), 'x-wf-')"

      - type: dsl
        name: ddos-guard
        dsl:
          - "contains(tolower(header), 'server: ddos-guard') || contains(tolower(header), '__ddg')"

      - type: dsl
        name: stackpath-fastly-azure
        dsl:
          - "contains(tolower(header), 'x-sp-') || contains(tolower(header), 'x-served-by: cache') || contains(tolower(header), 'fastly') || contains(tolower(header), 'x-azure-ref') || contains(tolower(header), 'x-fd-')"

    extractors:
      - type: dsl
        dsl:
          - "'Tespit edilen WAF/CDN: ' + (contains(tolower(header),'cloudflare') || contains(tolower(header),'cf-ray') ? 'Cloudflare ' : '') + (contains(tolower(header),'akamai') ? 'Akamai ' : '') + (contains(tolower(header),'incap') || contains(tolower(header),'x-iinfo') ? 'Imperva-Incapsula ' : '') + (contains(tolower(header),'bigip') || contains(tolower(header),'x-wa-info') ? 'F5-BIG-IP ' : '') + (contains(tolower(header),'amzn') || contains(tolower(header),'awselb') ? 'AWS ' : '') + (contains(tolower(header),'sucuri') ? 'Sucuri ' : '') + (contains(tolower(header),'barracuda') ? 'Barracuda ' : '') + (contains(tolower(header),'forti') ? 'Fortinet ' : '') + (contains(tolower(header),'mod_security') || contains(tolower(header),'modsecurity') ? 'ModSecurity ' : '') + (contains(tolower(header),'ddg') || contains(tolower(header),'ddos-guard') ? 'DDoS-Guard ' : '') + (contains(tolower(header),'fastly') || contains(tolower(header),'x-sp-') || contains(tolower(header),'azure') ? 'Fastly/StackPath/Azure ' : '')"
