id: pii-disclosure

info:
  name: PII Disclosure - KVKK/GDPR (Kişisel Veri Sızıntısı)
  author: nef
  severity: high
  description: |
    Yanıt gövdesinde açığa çıkan kişisel verileri (KVKK/GDPR kapsamında) tespit
    eder: T.C. Kimlik Numarası, TR ve genel (uluslararası) IBAN, Türk ve
    uluslararası telefon numaraları, kredi kartı numaraları ve e-posta adresleri.
    T.C. Kimlik No, yanlış pozitifleri azaltmak için bağlam kelimelerine
    (tc / kimlik / tckn) yakınlık şartıyla eşleştirilir.
  reference:
    - https://www.kvkk.gov.tr/
    - https://gdpr.eu/
    - https://owasp.org/www-project-top-ten/2021/A01_2021-Broken_Access_Control
  classification:
    cwe-id: CWE-359
  metadata:
    max-request: 1
  tags: exposure,disclosure,pii,kvkk,gdpr,privacy

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        name: tc-kimlik-no
        part: body
        regex:
          # Bağlam kelimesine yakın 11 haneli T.C. Kimlik No (ilk hane 0 olamaz)
          - "(?i)(t\\.?\\s?c\\.?\\s?kimlik(\\s*no)?|tckn|kimlik\\s*no|vatandaşlık\\s*no|national\\s*id)[^0-9]{0,20}([1-9][0-9]{10})"

      - type: regex
        name: iban
        part: body
        regex:
          # TR IBAN (TR + 24 hane) ve genel IBAN (2 harf ülke + 2 kontrol + 11-30 alfanümerik)
          - "TR\\d{2}[\\s]?(\\d{4}[\\s]?){5}\\d{2}"
          - "\\b[A-Z]{2}\\d{2}[\\s]?([A-Z0-9]{4}[\\s]?){2,7}[A-Z0-9]{1,4}\\b"

      - type: regex
        name: telefon
        part: body
        regex:
          # Türk cep telefonu (+90/0 5xx) ve genel uluslararası biçim
          - "(?:\\+90|0090|0)?[\\s.-]?5\\d{2}[\\s.-]?\\d{3}[\\s.-]?\\d{2}[\\s.-]?\\d{2}"
          - "\\+\\d{1,3}[\\s.-]?\\(?\\d{2,4}\\)?[\\s.-]?\\d{3,4}[\\s.-]?\\d{3,4}"

      - type: regex
        name: kredi-karti
        part: body
        regex:
          # Visa / MasterCard / Amex / Diners / JCB
          - "\\b(?:4[0-9]{12}(?:[0-9]{3})?|5[1-5][0-9]{14}|3[47][0-9]{13}|(?:2131|1800|35\\d{3})\\d{11}|6(?:011|5[0-9]{2})[0-9]{12})\\b"

      - type: regex
        name: eposta
        part: body
        regex:
          - "[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\\.(com\\.tr|org\\.tr|edu\\.tr|gov\\.tr|k12\\.tr|bel\\.tr|co\\.uk|com|net|org|io|dev|tr)"
