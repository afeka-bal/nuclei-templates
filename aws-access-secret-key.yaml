id: aws-access-secret-key

info:
  name: AWS Access/Secret Key Disclosure
  author: reewardius,ertansa
  severity: high
  description: |
    Yanıt gövdesinde açığa çıkan AWS erişim/gizli anahtarlarını tespit eder.
    Yanlış pozitifi azaltmak için yalnızca alan adlarının varlığına değil, gerçek
    anahtar değeri biçimine (AKIA/ASIA/AGPA… + 16 karakter) de bakar ve AWS
    dokümantasyonundaki örnek anahtarları (EXAMPLE) eler.
  reference:
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_identifiers.html
    - https://owasp.org/www-project-top-ten/2021/A02_2021-Cryptographic_Failures
  classification:
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
  tags: disclosure,aws,exposure,amazon,secret

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: regex
        condition: or
        part: body
        regex:
          # Gerçek AWS access key id biçimi
          - "(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}"
          # Alan adı + gizli anahtar biçimi birlikte
          - "(?i)(aws_secret_access_key|secretAccessKey)[\"']?\\s*[:=]\\s*[\"']?[A-Za-z0-9/+=]{40}"

      # AWS dokümantasyon örneklerini ele (yanlış pozitif)
      - type: word
        part: body
        words:
          - "EXAMPLEKEY"
          - "AKIAIOSFODNN7EXAMPLE"
          - "wJalrXUtnFEMI/K7MDENG"
        condition: or
        negative: true

    extractors:
      - type: regex
        part: body
        regex:
          - "(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}"
